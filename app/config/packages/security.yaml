security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                username_parameter: email
                password_parameter: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%env(REMEMBER_ME_SECRET)%'
                lifetime: 604800   # 7 days
                path: /
                samesite: strict

    role_hierarchy:
        ROLE_VIEWER:            [ROLE_USER]
        ROLE_LINKER:            [ROLE_VIEWER]
        ROLE_VIEWER_HSV:        [ROLE_VIEWER]
        ROLE_EDIT_STRONG_TRNL:  [ROLE_VIEWER]
        ROLE_ADMIN:             [ROLE_LINKER, ROLE_VIEWER_HSV, ROLE_EDIT_STRONG_TRNL]

    access_control:
        - { path: ^/login,               roles: PUBLIC_ACCESS }
        - { path: ^/admin,               roles: ROLE_ADMIN }
        - { path: ^/strongs/translate,   roles: ROLE_EDIT_STRONG_TRNL }
        - { path: ^/api/annotation/word, roles: ROLE_VIEWER }
        - { path: ^/api/annotation,      roles: ROLE_LINKER }
        - { path: ^/link,                roles: ROLE_LINKER }
        - { path: ^/book,                roles: ROLE_VIEWER }
        - { path: ^/,                    roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
