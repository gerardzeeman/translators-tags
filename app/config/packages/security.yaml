security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                username_parameter: email
                password_parameter: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%env(REMEMBER_ME_SECRET)%'
                lifetime: 604800   # 7 days
                path: /
                samesite: strict
                httponly: true
                secure: true

    role_hierarchy:
        ROLE_VIEWER:                [ROLE_USER]
        ROLE_LINKER:                [ROLE_VIEWER]
        ROLE_VIEWER_HSV:            [ROLE_VIEWER]
        ROLE_EDIT_STRONG_TRNL:      [ROLE_VIEWER]
        ROLE_EDIT_INSTITUTIO_TRNL:  [ROLE_VIEWER]
        ROLE_BLOGGER:               [ROLE_VIEWER]
        ROLE_ADMIN:                 [ROLE_LINKER, ROLE_VIEWER_HSV, ROLE_EDIT_STRONG_TRNL, ROLE_EDIT_INSTITUTIO_TRNL, ROLE_BLOGGER]

    access_control:
        - { path: ^/up,                    roles: PUBLIC_ACCESS }
        - { path: ^/login,                 roles: PUBLIC_ACCESS }
        - { path: ^/admin,                 roles: ROLE_ADMIN }
        - { path: ^/strongs/translate,     roles: ROLE_EDIT_STRONG_TRNL }
        - { path: ^/institutio/bewerk,     roles: ROLE_EDIT_INSTITUTIO_TRNL }
        - { path: ^/api/annotation/word,   roles: ROLE_VIEWER }
        - { path: ^/api/annotation,        roles: ROLE_LINKER }
        - { path: ^/link,                  roles: ROLE_LINKER }
        - { path: ^/blog/mijn,             roles: ROLE_BLOGGER }
        - { path: ^/blog/maken,            roles: ROLE_BLOGGER }
        - { path: ^/blog/embed-data,       roles: ROLE_BLOGGER }
        - { path: ^/blog/.+/bewerken,      roles: ROLE_BLOGGER }
        - { path: ^/blog/.+/publiceren,    roles: ROLE_BLOGGER }
        - { path: ^/blog/afbeeldingen,     roles: ROLE_BLOGGER }
        - { path: ^/blog,                  roles: PUBLIC_ACCESS }
        - { path: ^/book,                  roles: ROLE_VIEWER }
        - { path: ^/institutio,            roles: ROLE_VIEWER }
        - { path: ^/,                      roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
