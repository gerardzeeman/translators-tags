framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: true
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: strict
        storage_factory_id: session.storage.factory.native
    php_errors:
        log: true
    asset_mapper:
        paths:
            - assets/
        excluded_patterns:
            - assets/tests/*

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
