name: Deploy to production

on:
  push:
    branches: [main]
    # Documentatie-only pushes hoeven geen productie-deploy te triggeren.
    # Let op: een wijziging aan dit workflow-bestand zelf staat hier bewust
    # niet in, anders zou een toekomstige aanpassing aan de deploy-workflow
    # zelf nooit meer getest worden.
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Verbose SSH handshake/auth logging -- without this, a connection
          # failure only surfaces the bare Go ssh-client error (as it did
          # while diagnosing the earlier "no supported methods remain"
          # failures), with no detail on which auth method/key was tried.
          debug: true
          script: |
            set -e
            echo "== connected as: $(whoami)@$(hostname) =="
            echo "== working dir before cd: $(pwd) =="
            cd /translatorstags
            echo "== working dir after cd: $(pwd) =="
            docker compose version
            git pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull --no-cache app ingest
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker exec bible_app php bin/console cache:clear
            docker exec bible_app php bin/console asset-map:compile
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
